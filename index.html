<body>

<script type="module">

/* =========================================================
   Firebase 설정
   =========================================================
   아래 부분에 Firebase 웹 앱 설정을 넣으면
   온라인 리더보드가 활성화됩니다.

   예:
   const firebaseConfig = {
     apiKey: "...",
     authDomain: "...",
     databaseURL: "...",
     projectId: "...",
     storageBucket: "...",
     messagingSenderId: "...",
     appId: "..."
   };
*/

const firebaseConfig = {
  apiKey: "",
  authDomain: "",
  databaseURL: "",
  projectId: "",
  storageBucket: "",
  messagingSenderId: "",
  appId: ""
};

let firebaseEnabled = false;
let db = null;

if(firebaseConfig.apiKey && firebaseConfig.databaseURL){

  try{

    const { initializeApp } =
      await import(
        "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js"
      );

    const {
      getDatabase,
      ref,
      set,
      get,
      query,
      orderByChild,
      limitToLast
    } =
      await import(
        "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js"
      );

    const app = initializeApp(firebaseConfig);

    db = {
      database:getDatabase(app),
      ref,
      set,
      get,
      query,
      orderByChild,
      limitToLast
    };

    firebaseEnabled = true;

  }catch(error){

    console.error("Firebase 초기화 실패:",error);

  }

}


/* =========================================================
   게임 데이터
   ========================================================= */

const SAVE_KEY = "formwheel_clicker_save_v1";

let game = {
  score:0,
  power:1,
  auto:0,
  totalClicks:0,
  highScore:0
};

function loadGame(){

  try{

    const saved = localStorage.getItem(SAVE_KEY);

    if(saved){

      const data = JSON.parse(saved);

      game = {
        ...game,
        ...data
      };

    }

  }catch(error){

    console.error("저장 데이터 불러오기 실패",error);

  }

  updateUI();

}

function saveGame(){

  localStorage.setItem(
    SAVE_KEY,
    JSON.stringify(game)
  );

}

function formatNumber(number){

  return Math.floor(number).toLocaleString("ko-KR");

}


/* =========================================================
   UI
   ========================================================= */

const scoreEl = document.getElementById("score");
const powerEl = document.getElementById("power");
const autoEl = document.getElementById("auto");
const totalClicksEl = document.getElementById("totalClicks");
const highScoreEl = document.getElementById("highScore");

const powerPriceEl = document.getElementById("powerPrice");
const autoPriceEl = document.getElementById("autoPrice");

const clickPowerText =
  document.getElementById("clickPowerText");

const powerUpgrade =
  document.getElementById("powerUpgrade");

const autoUpgrade =
  document.getElementById("autoUpgrade");


function getPowerPrice(){

  return Math.floor(
    10 * Math.pow(1.65,game.power - 1)
  );

}

function getAutoPrice(){

  return Math.floor(
    50 * Math.pow(1.75,game.auto)
  );

}


function updateUI(){

  scoreEl.textContent = formatNumber(game.score);

  powerEl.textContent =
    formatNumber(game.power);

  autoEl.textContent =
    formatNumber(game.auto) + " /초";

  totalClicksEl.textContent =
    formatNumber(game.totalClicks);

  highScoreEl.textContent =
    formatNumber(game.highScore);

  clickPowerText.textContent =
    "+" + formatNumber(game.power);

  const powerPrice = getPowerPrice();
  const autoPrice = getAutoPrice();

  powerPriceEl.textContent =
    formatNumber(powerPrice);

  autoPriceEl.textContent =
    formatNumber(autoPrice);

  powerUpgrade.disabled =
    game.score < powerPrice;

  autoUpgrade.disabled =
    game.score < autoPrice;

}


/* =========================================================
   클릭
   ========================================================= */

document
  .getElementById("clickButton")
  .addEventListener("click",()=>{

    game.score += game.power;
    game.totalClicks++;

    if(game.score > game.highScore){
      game.highScore = game.score;
    }

    updateUI();
    saveGame();

  });


/* =========================================================
   클릭 파워 업그레이드
   ========================================================= */

powerUpgrade.addEventListener("click",()=>{

  const price = getPowerPrice();

  if(game.score < price) return;

  game.score -= price;
  game.power++;

  updateUI();
  saveGame();

});


/* =========================================================
   자동 클릭 업그레이드
   ========================================================= */

autoUpgrade.addEventListener("click",()=>{

  const price = getAutoPrice();

  if(game.score < price) return;

  game.score -= price;
  game.auto++;

  updateUI();
  saveGame();

});


/* =========================================================
   자동 클릭
   ========================================================= */

setInterval(()=>{

  if(game.auto <= 0) return;

  game.score += game.auto;

  if(game.score > game.highScore){
    game.highScore = game.score;
  }

  updateUI();
  saveGame();

},1000);


/* =========================================================
   리더보드
   ========================================================= */

const leaderboardList =
  document.getElementById("leaderboardList");

const nicknameInput =
  document.getElementById("nickname");

const myRankEl =
  document.getElementById("myRank");


let localLeaderboard = [];

function loadLocalLeaderboard(){

  try{

    const saved =
      localStorage.getItem(
        "formwheel_clicker_leaderboard_v1"
      );

    if(saved){
      localLeaderboard = JSON.parse(saved);
    }

  }catch(e){

    localLeaderboard = [];

  }

}


function saveLocalLeaderboard(){

  localStorage.setItem(
    "formwheel_clicker_leaderboard_v1",
    JSON.stringify(localLeaderboard)
  );

}


function renderLeaderboard(list){

  leaderboardList.innerHTML = "";

  if(!list.length){

    leaderboardList.innerHTML =
      '<div class="empty">아직 등록된 점수가 없습니다.</div>';

    return;

  }

  list
    .sort((a,b)=>b.score-a.score)
    .slice(0,20)
    .forEach((item,index)=>{

      const row =
        document.createElement("div");

      row.className = "rank-row";

      row.innerHTML = `
        <div class="rank">${index+1}</div>
        <div class="player"></div>
        <div class="points">
          ${formatNumber(item.score)}
        </div>
      `;

      row.querySelector(".player").textContent =
        item.name;

      leaderboardList.appendChild(row);

    });

}


/* =========================================================
   온라인 리더보드
   ========================================================= */

async function loadLeaderboard(){

  if(!firebaseEnabled){

    loadLocalLeaderboard();

    renderLeaderboard(localLeaderboard);

    return;

  }

  try{

    const leaderboardRef =
      db.ref(db.database,"clickerLeaderboard");

    const snapshot =
      await db.get(leaderboardRef);

    const data =
      snapshot.exists()
        ? snapshot.val()
        : {};

    const list =
      Object.values(data);

    renderLeaderboard(list);

  }catch(error){

    console.error(error);

    loadLocalLeaderboard();

    renderLeaderboard(localLeaderboard);

  }

}


/* =========================================================
   점수 등록
   ========================================================= */

window.submitScore = async function(){

  let name =
    nicknameInput.value.trim();

  if(!name){

    name = prompt("리더보드에 사용할 닉네임을 입력하세요.");

    if(!name) return;

    name = name.trim();

  }

  if(!name) return;

  if(name.length > 12){
    name = name.slice(0,12);
  }

  const score = Math.floor(game.highScore);

  if(score <= 0){

    alert("먼저 점수를 만들어주세요!");

    return;

  }


  /* 온라인 */

  if(firebaseEnabled){

    try{

      const safeName =
        name.replace(/[.#$/[\]]/g,"_");

      const playerRef =
        db.ref(
          db.database,
          "clickerLeaderboard/" + safeName
        );

      const old =
        await db.get(playerRef);

      if(!old.exists() || score > old.val().score){

        await db.set(
          playerRef,
          {
            name:name,
            score:score,
            updatedAt:Date.now()
          }
        );

      }

      alert("리더보드에 점수가 등록되었습니다!");

      await loadLeaderboard();

      showMyRank(name,score);

      return;

    }catch(error){

      console.error(error);

      alert(
        "온라인 등록에 실패했습니다. 로컬 리더보드에 저장합니다."
      );

    }

  }


  /* 로컬 */

  const existing =
    localLeaderboard.find(
      x => x.name === name
    );

  if(existing){

    if(score > existing.score){
      existing.score = score;
    }

  }else{

    localLeaderboard.push({
      name:name,
      score:score
    });

  }

  saveLocalLeaderboard();
  renderLeaderboard(localLeaderboard);
  showMyRank(name,score);

};


function showMyRank(name,score){

  const sorted =
    [...localLeaderboard]
      .sort((a,b)=>b.score-a.score);

  const index =
    sorted.findIndex(
      x => x.name === name && x.score <= score
    );

  if(index >= 0){

    myRankEl.style.display = "block";

    myRankEl.textContent =
      `내 최고 기록: ${formatNumber(score)}점 · ${index+1}위`;

  }

}


/* =========================================================
   시작
   ========================================================= */

loadGame();

loadLeaderboard();


/* =========================================================
   주기적 저장
   ========================================================= */

setInterval(()=>{

  saveGame();

},5000);

window.addEventListener("beforeunload",saveGame);

</script>

</body>
</html>
