<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f8fc">
<title>FormWheel Clicker</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f7f8fc;
  color:#17181c;
}

body{padding-bottom:50px}
button,input{font:inherit}

header{
  position:sticky;
  top:0;
  z-index:50;
  height:64px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 24px;
  background:rgba(255,255,255,.86);
  backdrop-filter:blur(16px);
  border-bottom:1px solid #e8e9ed;
}

.logo{
  text-decoration:none;
  color:#17181c;
  font-size:22px;
  font-weight:900;
  letter-spacing:-1px;
}

.logo span{
  display:inline-flex;
  width:28px;
  height:28px;
  align-items:center;
  justify-content:center;
  margin:0 3px;
  border-radius:50%;
  background:#17181c;
  color:white;
  font-size:15px;
}

.home{
  border:0;
  border-radius:12px;
  padding:9px 14px;
  background:#f0f1f4;
  color:#17181c;
  font-weight:800;
  cursor:pointer;
}

main{
  width:min(1050px,calc(100% - 28px));
  margin:30px auto;
}

.hero{
  text-align:center;
  margin-bottom:25px;
}

.hero h1{
  margin:0;
  font-size:44px;
  letter-spacing:-2px;
}

.hero p{
  margin:9px 0 0;
  color:#777b84;
}

.layout{
  display:grid;
  grid-template-columns:1.3fr .7fr;
  gap:18px;
}

.card{
  background:#fff;
  border:1px solid #e6e7eb;
  border-radius:24px;
  box-shadow:0 10px 35px rgba(20,25,35,.05);
}

/* GAME */

.game{
  padding:30px;
  text-align:center;
}

.score-label{
  color:#777b84;
  font-size:14px;
  font-weight:700;
}

.score{
  margin:10px 0 25px;
  font-size:58px;
  line-height:1;
  font-weight:950;
  letter-spacing:-3px;
  overflow-wrap:anywhere;
}

.click-button{
  width:min(330px,100%);
  aspect-ratio:1;
  border:0;
  border-radius:50%;
  background:#17181c;
  color:white;
  font-size:32px;
  font-weight:950;
  cursor:pointer;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
  box-shadow:0 17px 38px rgba(0,0,0,.17);
  transition:transform .08s,box-shadow .08s;
}

.click-button:hover{
  transform:scale(1.025);
}

.click-button:active{
  transform:scale(.94);
  box-shadow:0 8px 18px rgba(0,0,0,.13);
}

.click-info{
  margin-top:20px;
  color:#777b84;
  font-size:14px;
}

/* UPGRADES */

.upgrades{
  padding:22px;
}

.section-title{
  margin:2px 0 16px;
  font-size:20px;
  font-weight:900;
}

.upgrade{
  width:100%;
  margin-bottom:10px;
  padding:16px;
  text-align:left;
  border:1px solid #e5e6ea;
  border-radius:16px;
  background:#fafbfc;
  cursor:pointer;
  transition:.15s;
}

.upgrade:hover{
  background:#f1f2f5;
  transform:translateY(-1px);
}

.upgrade:disabled{
  opacity:.45;
  cursor:not-allowed;
  transform:none;
}

.upgrade-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.upgrade-name{
  font-weight:900;
}

.upgrade-price{
  font-weight:900;
}

.upgrade-desc{
  margin-top:5px;
  color:#777b84;
  font-size:13px;
  line-height:1.4;
}

.stats{
  margin-top:16px;
  padding-top:13px;
  border-top:1px solid #e7e8ec;
}

.stat{
  display:flex;
  justify-content:space-between;
  padding:7px 0;
  color:#6f737c;
}

.stat strong{
  color:#17181c;
}

/* LEADERBOARD */

.leaderboard{
  margin-top:18px;
  padding:24px;
}

.lb-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:16px;
}

.lb-title{
  font-size:21px;
  font-weight:900;
}

.small{
  border:0;
  border-radius:12px;
  padding:10px 14px;
  background:#17181c;
  color:#fff;
  font-weight:800;
  cursor:pointer;
}

.name-area{
  display:flex;
  gap:8px;
  margin-bottom:14px;
}

.nickname{
  width:100%;
  min-width:0;
  padding:11px 13px;
  border:1px solid #dddfe4;
  border-radius:12px;
  outline:none;
  background:#fff;
}

.nickname:focus{
  border-color:#999da7;
}

.status{
  min-height:18px;
  margin:5px 0 12px;
  color:#777b84;
  font-size:13px;
}

.my-rank{
  display:none;
  margin-bottom:12px;
  padding:12px 14px;
  border-radius:12px;
  background:#f1f2f5;
  font-size:14px;
  font-weight:800;
}

.rank-row{
  display:grid;
  grid-template-columns:48px 1fr auto;
  gap:10px;
  align-items:center;
  padding:13px 8px;
  border-bottom:1px solid #eeeef1;
}

.rank-row:last-child{
  border-bottom:0;
}

.rank{
  font-weight:900;
  color:#777b84;
}

.player{
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-weight:800;
}

.points{
  font-weight:900;
}

.empty{
  padding:25px;
  text-align:center;
  color:#858992;
}

.notice{
  margin-top:15px;
  color:#92959d;
  font-size:12px;
  line-height:1.5;
}

@media(max-width:760px){

  header{
    padding:0 15px;
  }

  main{
    width:calc(100% - 18px);
    margin-top:20px;
  }

  .hero h1{
    font-size:35px;
  }

  .layout{
    grid-template-columns:1fr;
  }

  .game{
    padding:22px;
  }

  .score{
    font-size:48px;
  }

  .click-button{
    width:min(275px,80vw);
  }
}
</style>
</head>

<header>

  <a
    class="logo"
    href="https://semicolonxss.github.io/Formwheel/"

</header>

  <section class="hero">

    <p>

  </section>

    <!-- UPGRADES -->

    <aside class="card upgrades">

      <button

        <div

        </div>

      </button>

      <button

        <div class="upgrade-top">

          <div class="upgrade-name">
            🤖 자동 클릭
          </div>

          <div
            class="upgrade-price"

          </div>

        </div>

        <div
          class="upgrade-desc"
          id="autoDesc"
        >
          매초 자동으로 점수를 얻습니다.
        </div>

      </button>

      <div class="stats">

        <div class="stat">
          <span>클릭 파워</span>
          <strong id="power">1</strong>
        </div>

        <div class="stat">
          <span>자동 클릭</span>
          <strong id="auto">0 /초</strong>
        </div>

        <div class="stat">

        </div>

        <div class="stat">

          <strong id="highScore">0</strong>
        </div>

      </div>

    </aside>

  </div>

  <!-- LEADERBOARD -->

  <section class="card leaderboard">

    <div class="lb-head">

      <div class="lb-title">

      </div>

      <button
        class="small"

        점수 등록
      </button>

    </div>

    <div class="name-area">

      <input
        class="nickname"
        id="nickname"
        maxlength="12"
        autocomplete="off"
        placeholder="닉네임 (최대 12자)"
      >

    </div>

    <div
      class="status"
      id="status"
    ></div>

    <div
      class="my-rank"

    ></div>

    <div id="leaderboardList">

      <div class="empty">
        리더보드를 불러오는 중...

    </div>

    <div class="notice">
      게임 진행 상황은 이 브라우저에 자동 저장됩니다.
      리더보드 점수는 Firebase Realtime Database에 저장됩니다.
    </div>

  </section>

</main>

let game = {

  score:0,

  power:0.1,

  auto:0,

  totalClicks:0,

  highScore:0

/* =========================================================
   POWER NORMALIZE
   ========================================================= */

/*
  예전에 4 같은 값으로 저장된 데이터가 있다면
  다음 단계인 5로 자동 변환합니다.
*/

function normalizePower(value){

  const number =
    Number(value) || 1;


  if(
    POWER_LEVELS.includes(number)
  ){

    return number;

  }


  const next =
    POWER_LEVELS.find(
      power => power >= number
    );


  return next ||
    POWER_LEVELS[POWER_LEVELS.length - 1];

}

function normalizeAuto(value){

  const number =
    Math.max(0, Number(value) || 0);


  if(
    AUTO_LEVELS.includes(number)
  ){

    return number;

  }


  const next =
    AUTO_LEVELS.find(
      auto => auto >= number
    );


  return next ||
    AUTO_LEVELS[AUTO_LEVELS.length - 1];

}


/* =========================================================
   LOAD / SAVE
   ========================================================= */

function loadGame(){

  try{

    const saved =
      localStorage.getItem(SAVE_KEY);


    if(saved){

      const data =
        JSON.parse(saved);


      game = {

        ...game,

        ...data

      };


      game.power =
        normalizePower(
          game.power
        );


      game.score =
        Math.max(
          0,
          Number(game.score) || 0
        );

      game.auto =
        normalizeAuto(
          game.auto
        );

      game.totalClicks =
        Math.max(
          0,
          Number(game.totalClicks) || 0
        );

      game.highScore =
        Math.max(
          0,
          Number(game.highScore) || 0
        );

    }

  }catch(error){

    console.error(
      "게임 저장 데이터 오류:",
      error
    );

  }

  updateUI();

}


function saveGame(){

  try{

    localStorage.setItem(
      SAVE_KEY,
      JSON.stringify(game)
    );

  }catch(error){

    console.error(
      "게임 저장 실패:",
      error
    );

  }

}

/* =========================================================
   NUMBER
   ========================================================= */

function formatNumber(number){

  return Math.floor(number)
    .toLocaleString("ko-KR");

}


/* =========================================================
   POWER UPGRADE
   ========================================================= */

function getPowerIndex(){

  return POWER_LEVELS.indexOf(
    game.power
  );

}


function getNextPower(){

  const index =
    getPowerIndex();


  if(index === -1){

    return POWER_LEVELS.find(
      power => power > game.power
    ) || null;

  }


  return POWER_LEVELS[index + 1] || null;

}


/*
  업그레이드 가격

  1 → 2 : 10
  2 → 3 : 17
  3 → 5 : 30
  5 → 10 : 52
  10 → 15 : 91
  ...
*/

function getPowerPrice(){

  const index =
    getPowerIndex();


  if(index < 0){

    return 10;

  }


  return Math.floor(
    10 *
    Math.pow(
      1.75,
      index
    )
  );

}


function getAutoIndex(){

  return AUTO_LEVELS.indexOf(
    game.auto
  );

}


function getNextAuto(){

  const index =
    getAutoIndex();


  if(index === -1){

    return AUTO_LEVELS.find(
      auto => auto > game.auto
    ) || null;

  }


  return AUTO_LEVELS[index + 1] || null;

}


function getAutoPrice(){

  const index =
    getAutoIndex();


  if(index < 0){

    return 50;

  }


  return Math.floor(
    50 *
    Math.pow(
      1.75,
      index
    )
  );

}


/* =========================================================

   ========================================================= */

  scoreEl.textContent =
    formatNumber(game.score);


  powerEl.textContent =
    formatNumber(game.power);


  autoEl.textContent =
    formatNumber(game.auto) +
    " /초";


  totalClicksEl.textContent =
    formatNumber(game.totalClicks);


  highScoreEl.textContent =
    formatNumber(game.highScore);


  clickPowerText.textContent =
    "+" +
    formatNumber(game.power);


  const nextPower =
    getNextPower();


  if(nextPower === null){

    powerPriceEl.textContent =
      "MAX";


    powerDescEl.textContent =
      "최대 클릭 파워에 도달했습니다.";


    powerUpgrade.disabled =
      true;

  }else{

    const powerPrice =
      getPowerPrice();


    powerPriceEl.textContent =
      formatNumber(powerPrice);


    powerDescEl.textContent =
      `클릭 파워를 ${formatNumber(game.power)} → ${formatNumber(nextPower)}로 증가시킵니다.`;


    powerUpgrade.disabled =
      game.score < powerPrice;

  }


  const nextAuto =
    getNextAuto();


  if(nextAuto === null){

    autoPriceEl.textContent =
      "MAX";

    autoDescEl.textContent =
      "자동 클릭이 최대 단계입니다.";


    autoUpgrade.disabled =
      true;

  }else{

    const autoPrice =
      getAutoPrice();


    autoPriceEl.textContent =
      formatNumber(autoPrice);

    autoDescEl.textContent =
      `자동 클릭을 ${formatNumber(game.auto)} → ${formatNumber(nextAuto)} /초로 증가시킵니다.`;


    autoUpgrade.disabled =
      game.score < autoPrice;

  }

}


/* =========================================================
   CLICK
   ========================================================= */

clickButton.addEventListener(
  "click",
  ()=>{

    game.score +=
      game.power;

    game.totalClicks++;


    if(
      game.score >
      game.highScore
    ){

      game.highScore =
        game.score;

    }


    updateUI();
    saveGame();

  }
);


/* =========================================================
   POWER UPGRADE
   ========================================================= */

powerUpgrade.addEventListener(
  "click",
  ()=>{

    const nextPower =
      getNextPower();


    if(nextPower === null){

      return;

    }


    const price =
      getPowerPrice();


    if(
      game.score <
      price
    ){

      return;

    }


    game.score -=
      price;


    /*
      기존처럼 +1 하는 것이 아니라
      다음 단계의 숫자로 바로 변경
    */

    game.power =
      nextPower;


    updateUI();
    saveGame();

  }
);


/* =========================================================
   AUTO CLICK UPGRADE
   ========================================================= */

autoUpgrade.addEventListener(
  "click",
  ()=>{

    const price =
      getAutoPrice();


    if(
      game.score <
      price
    ){

      return;

    }


    game.score -=
      price;


    const nextAuto =
      getNextAuto();


    if(nextAuto === null){

      return;

    }


    game.auto =
      nextAuto;


    updateUI();
    saveGame();

  }
);


/* =========================================================
   AUTO CLICK
   ========================================================= */

setInterval(
  ()=>{

    if(game.auto <= 0){
      return;
    }


    game.score +=
      game.auto;


    if(
      game.score >
      game.highScore
    ){

      game.highScore =
        game.score;

    }


    updateUI();
    saveGame();

  },
  1000
);


/* =========================================================
   LEADERBOARD RENDER
   ========================================================= */

function renderLeaderboard(list){

  leaderboardList.innerHTML = "";


  list.sort(
    (a,b)=>
      Number(b.score) -
      Number(a.score)
  );


  const top =
    list.slice(0,20);


  if(!top.length){

    leaderboardList.innerHTML =
      `
      <div class="empty">
        아직 등록된 점수가 없습니다.
      </div>
      `;

    return;

  }


  top.forEach(
    (item,index)=>{

      const row =
        document.createElement("div");

      row.className =
        "rank-row";


      const rank =
        document.createElement("div");

      rank.className =
        "rank";

      rank.textContent =
        index + 1;


      const player =
        document.createElement("div");

      player.className =
        "player";

      player.textContent =
        item.name || "Unknown";


      const points =
        document.createElement("div");

      points.className =
        "points";

      points.textContent =
        formatNumber(
          Number(item.score) || 0
        );


      row.appendChild(rank);
      row.appendChild(player);
      row.appendChild(points);


      leaderboardList.appendChild(row);

    }
  );

}


/* =========================================================
   LOAD LEADERBOARD
   ========================================================= */

async function loadLeaderboard(){

  statusEl.textContent =
    "리더보드를 불러오는 중...";


  try{

    const leaderboardRef =
      ref(
        db,
        "clickerLeaderboard"
      );


    const snapshot =
      await get(
        leaderboardRef
      );


    const data =
      snapshot.exists()
        ? snapshot.val()
        : {};


    const list =
      Object.values(data);


    renderLeaderboard(list);


    statusEl.textContent =
      "온라인 리더보드 연결됨";

  }catch(error){

    console.error(error);

    leaderboardList.innerHTML =
      `
      <div class="empty">
        리더보드를 불러오지 못했습니다.
      </div>
      `;

    statusEl.textContent =
      "Firebase 연결을 확인해주세요.";

  }

}


/* =========================================================
   SAFE KEY
   ========================================================= */

function makePlayerKey(name){

  return name
    .replace(/[.#$/[\]]/g,"_")
    .slice(0,30);

}


/* =========================================================
   SUBMIT SCORE
   ========================================================= */

async function submitScore(){

  let name =
    nickname.value.trim();


  if(!name){

    alert(
      "닉네임을 입력해주세요."
    );

    nickname.focus();

    return;

  }


  if(name.length > 12){

    name =
      name.slice(0,12);

  }


  const score =
    Math.floor(
      game.highScore
    );


  if(score <= 0){

    alert(
      "먼저 점수를 만들어주세요!"
    );

    return;

  }


  const key =
    makePlayerKey(name);


  if(!key){

    alert(
      "사용할 수 없는 닉네임입니다."
    );

    return;

  }


  statusEl.textContent =
    "점수를 등록하는 중...";


  try{

    const playerRef =
      ref(
        db,
        "clickerLeaderboard/" +
        key
      );


    const oldSnapshot =
      await get(
        playerRef
      );


    if(oldSnapshot.exists()){

      const oldData =
        oldSnapshot.val();


      const oldScore =
        Number(
          oldData.score || 0
        );


      if(score <= oldScore){

        alert(
          `기존 최고 기록은 ${formatNumber(oldScore)}점입니다.`
        );

      }else{

        await set(
          playerRef,
          {
            name:name,
            score:score,
            updatedAt:Date.now()
          }
        );

        alert(
          "최고 기록이 갱신되었습니다!"
        );

      }

    }else{

      await set(
        playerRef,
        {
          name:name,
          score:score,
          updatedAt:Date.now()
        }
      );

      alert(
        "리더보드에 등록되었습니다!"
      );

    }


    await loadLeaderboard();

    await showMyRank(
      name,
      score
    );


  }catch(error){

    console.error(error);

    statusEl.textContent =
      "점수 등록 실패";

    alert(
      "점수 등록에 실패했습니다.\n\n" +
      "Firebase Realtime Database 규칙을 확인해주세요."
    );

  }

}


/* =========================================================
   MY RANK
   ========================================================= */

async function showMyRank(
  name,
  score
){

  try{

    const leaderboardRef =
      ref(
        db,
        "clickerLeaderboard"
      );


    const snapshot =
      await get(
        leaderboardRef
      );


    if(!snapshot.exists()){
      return;
    }


    const data =
      snapshot.val();


    const list =
      Object.values(data)
        .sort(
          (a,b)=>
            Number(b.score) -
            Number(a.score)
        );


    const index =
      list.findIndex(
        item =>
          item.name === name
      );


    if(index >= 0){

      myRank.style.display =
        "block";


      myRank.textContent =
        `내 기록 · ${formatNumber(score)}점 · ${index+1}위`;

    }

  }catch(error){

    console.error(error);

  }

}


/* =========================================================
   BUTTON
   ========================================================= */

document
  .getElementById("submitButton")
  .addEventListener(
    "click",
    submitScore
  );


/* =========================================================
   ENTER KEY
   ========================================================= */

nickname.addEventListener(
  "keydown",
  event => {

    if(event.key === "Enter"){

      submitScore();

    }

  }
);


/* =========================================================
   START
   ========================================================= */

loadGame();

loadLeaderboard();


/* =========================================================
   AUTO SAVE
   ========================================================= */

setInterval(
  saveGame,
  5000
);


window.addEventListener(
  "beforeunload",
  saveGame
);

</script>
